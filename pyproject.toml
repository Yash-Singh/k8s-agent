[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-agent"
version = "0.1.0"
description = "Kubernetes Investigation Agent that analyzes logs, diagnoses root causes, and provides detailed evidence."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "K8s Agent Team" }
]
dependencies = [
    "google-adk[bigquery-analytics,gcp,otel-gcp]>=2.8.0,<2.9.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "kubernetes>=31.0.0",
    "rich>=13.0",
    "python-dotenv>=1.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
lint = [
    "ruff",
    "codespell",
    "ty",
    "pytest>=7.0",
]



[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ty[lint]>=0.0.84",
]

